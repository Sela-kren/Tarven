<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Last Call at Tarven</title>
    <link rel="stylesheet" href="/src/styles/index.css" />
  </head>
  <body>
    <div id="status">Loading...</div>
    <div id="stats"></div>
    <div id="toast" role="status" aria-live="polite"></div>
    <div id="prompt"></div>
    <div id="hud">WASD / arrows: move &nbsp; Shift: run &nbsp; E: use / serve &nbsp; C: swap sibling &nbsp; Esc: pause</div>
    <div id="select" aria-label="Character select">
      <h1>Who are you?</h1>
      <p class="hint">Click a sibling (or press 1 / 2) to choose. You can swap during the night with C.</p>
      <button type="button" id="select-start" disabled>Choose a sibling</button>
    </div>
    <div id="story" aria-live="polite">
      <div id="story-cg"></div>
      <div class="sprite" id="story-sprite-0"></div>
      <div class="sprite" id="story-sprite-1"></div>
      <button type="button" id="story-skip">Skip &#9656;&#9656;</button>
      <div class="box">
        <div id="story-name"></div>
        <p id="story-text"></p>
        <div id="story-next">&#9660;</div>
      </div>
    </div>
    <div id="panel" role="dialog" aria-modal="true"></div>
    <div id="fade"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
