<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Last Call at Tarven</title>
    <style>
      html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
      canvas { display: block; image-rendering: pixelated; }
      #hud, #status, #stats, #prompt, #toast, #panel {
        position: fixed;
        font: 14px/1.4 "Courier New", monospace;
        color: #e8d3a2;
        text-shadow: 2px 2px 0 #000;
      }
      #hud, #status, #stats, #prompt, #toast { pointer-events: none; }
      #hud { left: 16px; bottom: 12px; }
      #status { inset: 0; display: grid; place-items: center; font-size: 18px; text-align: center; padding: 16px; }
      #stats { left: 16px; right: 16px; top: 10px; font-size: 16px; font-weight: bold; white-space: pre-wrap; }
      #prompt { left: 16px; right: 16px; bottom: 44px; text-align: center; font-size: 18px; font-weight: bold; color: #ffe27a; }
      #toast { left: 50%; top: 66px; width: min(680px, calc(100vw - 32px)); transform: translateX(-50%); text-align: center; font-size: 16px; }
      #panel {
        inset: 0;
        display: none;
        place-items: center;
        padding: 16px;
        background: rgba(5, 3, 2, 0.72);
        overflow-y: auto;
      }
      #panel.open { display: grid; }
      #panel .box {
        box-sizing: border-box;
        width: min(620px, 100%);
        padding: 20px 24px;
        background: #1b120b;
        border: 4px solid #6d4a25;
        box-shadow: 8px 8px 0 #000;
      }
      #panel h1 { margin: 0 0 10px; font-size: 24px; color: #ffe27a; }
      #panel p { margin: 0 0 12px; font-size: 16px; }
      #panel button {
        display: block;
        width: 100%;
        margin-top: 8px;
        padding: 10px 12px;
        font: bold 15px/1.3 "Courier New", monospace;
        color: #f0e4c4;
        text-align: left;
        cursor: pointer;
        background: #3a2615;
        border: 2px solid #6d4a25;
      }
      #panel button:hover:not(:disabled), #panel button:focus-visible { background: #5a3b1f; outline: 2px solid #ffe27a; }
      #panel button:disabled { color: #7d6c55; cursor: default; }
    </style>
  </head>
  <body>
    <div id="status">Loading...</div>
    <div id="stats"></div>
    <div id="toast" role="status" aria-live="polite"></div>
    <div id="prompt"></div>
    <div id="hud">WASD / arrows: move &nbsp; Shift: run &nbsp; E: use / serve &nbsp; C: swap sibling</div>
    <div id="panel" role="dialog" aria-modal="true"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
