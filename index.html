<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Last Call at Tarven</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Pixel type to match the dithered look: a blackletter for titles, a plain pixel face for everything else. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jacquard+24&family=Pixelify+Sans:wght@400;600;700&display=swap" />
    <link rel="stylesheet" href="/src/styles/index.css" />
  </head>
  <body>
    <div id="status">Loading...</div>
    <div id="stats"></div>
    <div id="status-card" aria-label="Your status" hidden></div>
    <div id="clock" aria-label="Time of day">
      <canvas id="clock-dial"></canvas>
      <div class="clock-text">
        <div id="clock-time"></div>
        <div id="clock-day"></div>
      </div>
    </div>
    <div id="speech" aria-hidden="true"></div>
    <div id="prompt"></div>
    <div id="hud">WASD / arrows: move &nbsp; Shift: run &nbsp; E: use / serve &nbsp; O: walk style &nbsp; M: mute &nbsp; Esc: pause</div>
    <div id="select" aria-label="Character select">
      <h1>Who are you?</h1>
      <p class="hint">Click one, or press 1 / 2</p>
      <div class="actions">
        <button type="button" id="select-customize" disabled><span class="key">C</span><span class="label">Customize</span></button>
        <button type="button" id="select-start" disabled><span class="key">&#8629;</span><span class="label">Choose a character</span></button>
      </div>
    </div>
    <div id="customize" aria-label="Customize your character"></div>
    <div id="story" aria-live="polite">
      <div id="story-cg"></div>
      <div class="sprite" id="story-sprite"></div>
      <button type="button" id="story-skip">Skip &#9656;&#9656;</button>
      <div class="box">
        <div id="story-name"></div>
        <p id="story-text"></p>
        <div id="story-next">&#9660;</div>
      </div>
    </div>
    <div id="talk" role="dialog" aria-live="polite" aria-label="Conversation">
      <div class="portrait" id="talk-guest"></div>
      <div class="portrait" id="talk-you"></div>
      <div class="box">
        <div id="talk-name"></div>
        <div id="touch-force" aria-hidden="true">
          <span class="force-label">Force</span>
          <div class="force-bar"><div class="force-fill"></div></div>
          <span class="force-value"></span>
          <span class="house-mode"></span>
        </div>
        <p id="talk-text"></p>
        <div id="talk-next">&#9660;</div>
        <div id="talk-choices"></div>
      </div>
    </div>
    <div id="comic" aria-hidden="true"></div>
    <div id="build" aria-label="House plans"></div>
    <div id="panel" role="dialog" aria-modal="true"></div>
    <div id="fade"></div>
    <script>
      // If the game's code can't be fetched (a dropped connection, or a web filter cutting into local traffic), the
      // page would sit on "Loading..." for ever. Say so instead, with a way to try again. main.ts turns this off
      // as soon as it runs (window.__tarvenStarted), and its own loading bar takes over from there.
      (function () {
        var STALL_SECONDS = 20;
        function stuck(why) {
          if (window.__tarvenStarted) return;
          var status = document.getElementById("status");
          if (!status) return;
          status.classList.add("stuck");
          status.textContent = "";
          var line = document.createElement("div");
          line.textContent = why;
          var again = document.createElement("button");
          again.type = "button";
          again.textContent = "Reload";
          again.onclick = function () { location.reload(); };
          status.append(line, again);
        }
        // A dropped download usually goes through on a second try: reload once by itself, then ask.
        function failed() {
          if (window.__tarvenStarted) return;
          var tried = false;
          try {
            tried = sessionStorage.getItem("tarven.retried") === "1";
            if (!tried) sessionStorage.setItem("tarven.retried", "1");
          } catch (e) {
            tried = true;
          }
          if (!tried) location.reload();
          else stuck("Part of the game could not be downloaded (the connection dropped).");
        }
        window.__tarvenStuck = stuck;
        window.__tarvenFailed = failed;
        setTimeout(function () {
          stuck("This is taking longer than it should. Part of the game may not have downloaded.");
        }, STALL_SECONDS * 1000);
      })();
    </script>
    <script
      type="module"
      src="/src/main.ts"
      onerror="window.__tarvenFailed && window.__tarvenFailed()"
    ></script>
  </body>
</html>
